name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Windows: 一本化後のAvalonia版をSingleFile発行し、従来どおりInno Setupインストーラーも作る
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish (win-x64)
        run: >
          dotnet publish src/TimecodeBridge.App/TimecodeBridge.App.csproj
          -c Release
          --self-contained
          -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      # インストーラー(iss)は publish\TimecodeBridge2.exe を前提にしているため名前を合わせる
      - name: Rename exe for installer
        run: Rename-Item publish/TimecodeBridge.App.exe "TimecodeBridge2.exe"

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DAppVersion=$version installer\TimecodeBridge.iss

      - name: Rename portable exe
        run: Rename-Item publish/TimecodeBridge2.exe "TimecodeBridge2-${{ github.ref_name }}.exe"

      # 旧v1系(WPF版 TimecodeBridge)も並行して発行する。中身はv2と同じCoreデコーダを共有するため
      # NaN/Inf混入によるTC永久停止の修正が同じく効く。v1利用者向けにアップグレードを届ける。
      - name: Publish v1 (win-x64)
        run: >
          dotnet publish src/TimecodeBridge/TimecodeBridge.csproj
          -c Release
          --self-contained
          -r win-x64
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish-v1

      # v1はv2とバージョン体系が異なる(1.4.x)。1タグで両製品を同梱するため、v1の内部バージョンは
      # 固定値で持ち、配布ファイル名もタグに依存しない固定名にする（利用者は常に最新版を取得する）。
      - name: Build v1 installer
        shell: pwsh
        run: |
          iscc /DAppVersion=1.4.13 /F"TimecodeBridge-Setup" installer\TimecodeBridge-v1.iss

      - name: Rename v1 portable exe
        run: Rename-Item publish-v1/TimecodeBridge.exe "TimecodeBridge-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            publish/TimecodeBridge2-*.exe
            publish-v1/TimecodeBridge-portable.exe
            installer-output/*.exe

  # macOS: .appバンドルを組み立ててzip化（未署名・未公証。初回起動は右クリック→開く）
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish and bundle (.app)
        run: |
          set -euo pipefail
          for rid in osx-arm64 osx-x64; do
            dotnet publish src/TimecodeBridge.App/TimecodeBridge.App.csproj \
              -c Release --self-contained -r "$rid" -o "publish-$rid"
            APP="TimecodeBridge2.app"
            rm -rf "$APP"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp -R "publish-$rid/." "$APP/Contents/MacOS/"
            cp src/TimecodeBridge.App/Info.plist "$APP/Contents/Info.plist"
            chmod +x "$APP/Contents/MacOS/TimecodeBridge.App"
            ditto -c -k --sequesterRsrc --keepParent "$APP" "TimecodeBridge2-${{ github.ref_name }}-$rid.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TimecodeBridge2-*.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**

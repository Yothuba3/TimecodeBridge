name: Release v3

# v3 系列(TimecodeBridge3: Avalonia 12 + WebView + libltc)。v2 は release.yml。
on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/TimecodeBridge.Web/package-lock.json

      # dist は git 管理。CI で再ビルドして差分が無いことを確かめる(手元のビルド忘れを検出)
      - name: Build Web UI and verify committed dist
        working-directory: src/TimecodeBridge.Web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- dist

      - name: Build libltc (arm64, LGPL dynamic library)
        run: ./native/libltc/build-macos.sh native/libltc/out

      - name: Publish and bundle (.app, Apple Silicon)
        run: |
          set -euo pipefail
          dotnet publish src/TimecodeBridge.Host/TimecodeBridge.Host.csproj \
            -c Release --self-contained -r osx-arm64 -o publish
          APP="TimecodeBridge3.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "publish/." "$APP/Contents/MacOS/"
          cp src/TimecodeBridge.Host/Info.plist "$APP/Contents/Info.plist"
          cp native/libltc/out/libltc-COPYING.txt "$APP/Contents/Resources/"
          cp THIRD_PARTY_NOTICES.md "$APP/Contents/Resources/"
          VERSION="${{ github.ref_name }}"; VERSION="${VERSION#v}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$VERSION" "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/TimecodeBridge3"
          # 同梱物の確認: libltc は動的リンクのまま(静的に取り込まれていない)、Web 資産がある
          test -f "$APP/Contents/MacOS/libltc.dylib"
          test -f "$APP/Contents/MacOS/web/index.html"
          otool -L "$APP/Contents/MacOS/libltc.dylib" | grep -q '@rpath/libltc.dylib'
          codesign --force --deep -s - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "TimecodeBridge3-${{ github.ref_name }}-osx-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: TimecodeBridge3-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/TimecodeBridge.Web/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1

      # dist の差分検査は macOS ジョブで行う(Windows は改行コードの自動変換で偽の差分が出る)
      - name: Build Web UI
        working-directory: src/TimecodeBridge.Web
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Build libltc.dll
        shell: cmd
        run: native\libltc\build-windows.cmd native\libltc\out

      - name: Publish (win-x64)
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/TimecodeBridge.Host/TimecodeBridge.Host.csproj \
            -c Release --self-contained -r win-x64 -o publish
          test -f publish/libltc.dll
          test -f publish/web/index.html
          cp THIRD_PARTY_NOTICES.md publish/

      # 起動しないビルドを出さない(v3.0.0 の Windows 版は起動直後に落ちていた)。詳しい確認は ci-v3.yml
      - name: Ensure WebView2 runtime
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $pv = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id" |
            ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } | Where-Object { $_ -and $_ -ne '0.0.0.0' } | Select-Object -First 1
          if ($pv) { "WebView2 runtime $pv"; exit 0 }
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe"
          Start-Process "$env:RUNNER_TEMP\MicrosoftEdgeWebview2Setup.exe" -ArgumentList '/silent', '/install' -Wait

      - name: Smoke (publish)
        shell: pwsh
        run: pwsh tools/tcb3/smoke-windows.ps1 -Exe publish\TimecodeBridge3.exe -RunDir "$env:RUNNER_TEMP\smoke-publish"

      - name: Zip (win-x64)
        shell: bash
        run: |
          cd publish && 7z a "../TimecodeBridge3-${{ github.ref_name }}-win-x64.zip" .

      # WebView2 Evergreen ブートストラッパーを取得し、未導入 PC で実行するインストーラーを作る
      - name: Build installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile installer/MicrosoftEdgeWebview2Setup.exe
          $version = "${{ github.ref_name }}".TrimStart("v")
          iscc /DAppVersion=$version installer\TimecodeBridge3.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            TimecodeBridge3-*.zip
            installer-output/*.exe

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
